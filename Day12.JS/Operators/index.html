<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <script>
        //Arthmetic Operators - +,-,*,%,/

        var a=10
        var b=9
        console.log(a+b)//19
        console.log(a-b)//1
        console.log(a*b)//90
        console.log(a/b)//1.1111
        console.log(a%b)//1

        //Assignment operator - Helps us to assign values by using equal to -=
        var x=2
        //Assign and Operation
        console.log(x+=2)
    </script>
</body>
</html>
