<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <script>
        //Arthmetic Operators - +,-,*,%,/

        var a=10
        var b=9
        console.log(a+b)//19
        console.log(a-b)//1
        console.log(a*b)//90
        console.log(a/b)//1.1111
        console.log(a%b)//1

        //Assignment operator - Helps us to assign values by using equal to -=
        var x=2
        //Assign and Operation
        console.log(x+=2)//4

        //Comparision Operators- ==,===,!=,!==,>,<,<=,>=

        let sum=10
        sum=20
        const pi=3.14
        const p=10
        const q=10

        console.log(p>q)//T
        console.log(p<q)//F

        const age1=35
        const age2=35

        console.log(age1>=age2)
        console.log(age1<=age2)

        const height1=170
        const height2="170"

        //==:only checks the value

        console.log(height1==height2) //True
        
        //===:checks the value and datatype

        console.log(height1===height2)//False

        //Logical operators - AND , OR, NOT


         //AND &&:Both condition is true then output is true

         const netflix=true
         const disney=false
         console.log(netflix && disney)

         //OR ||:If any one condition is true then output is true

         let ismem=true
         let bill=800
         console.log(ismem || bill>=1000)

         //NOT !:opposite

         let loggedIn=true
         console.log(!loggedIn)

         
    </script>
</body>
</html>
